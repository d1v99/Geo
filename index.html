<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1d1330" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>A Surprise For You 💜</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- ===================================================================
       EVERYTHING IS IN THIS ONE FILE so it always loads correctly.
       To edit your gifts & names, scroll down to "EDIT YOUR GIFTS HERE".
       =================================================================== -->

  <style>
  :root {
    --bg-1: #1d1330;
    --bg-2: #2c1d48;
    --ink: #f6f0fb;
    --muted: #cdbce0;
    --gold: #cbabf2;       /* "accent" — now a soft lilac */
    --gold-soft: #e9dcff;  /* light lilac */
    --rose-1: #d9b3ff;   --rose-2: #a86ff0;   /* massage box — lilac */
    --violet-1: #c9a7ff; --violet-2: #8a5cf0; /* lashes box — deeper lilac */
    --amber-1: #ffcf8a;  --amber-2: #f29c3c;
    --emerald-1: #bdb0ff;--emerald-2: #7d8cf0; /* sushi box — periwinkle lilac */
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    font-family: "Poppins", system-ui, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(1200px 600px at 50% -10%, #432d68 0%, transparent 60%),
      linear-gradient(160deg, var(--bg-1), var(--bg-2));
    min-height: 100vh;
    overflow-x: hidden;
  }
  .screen { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 20px; text-align: center; }
  /* hearts */
  .hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .hearts span { position: absolute; bottom: -40px; font-size: 18px; opacity: 0; animation: floatUp linear infinite; }
  @keyframes floatUp {
    0% { transform: translateY(0) scale(.6) rotate(0deg); opacity: 0; }
    10% { opacity: .55; } 90% { opacity: .45; }
    100% { transform: translateY(-110vh) scale(1) rotate(40deg); opacity: 0; }
  }
  /* screen 1 */
  .box-screen { position: relative; z-index: 1; }
  .photo-frame { width: clamp(150px, 42vw, 200px); aspect-ratio: 3 / 4; margin-bottom: 26px; border-radius: 18px; padding: 8px; background: linear-gradient(160deg, rgba(255,255,255,.18), rgba(255,255,255,.05)); border: 1px solid rgba(255,255,255,.18); box-shadow: 0 24px 50px -22px rgba(0,0,0,.7); transform: rotate(-3deg); animation: cardIn .8s both; }
  .photo-frame img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; display: block; }
  .box-eyebrow { letter-spacing: .35em; text-transform: uppercase; font-size: 12px; color: var(--gold); margin-bottom: 14px; }
  .box-title { font-family: "Cormorant Garamond", serif; font-weight: 600; font-size: clamp(30px, 7vw, 52px); line-height: 1.1; max-width: 12ch; margin-bottom: 42px; }
  .giftbox { --size: 150px; position: relative; width: var(--size); height: var(--size); background: none; border: none; cursor: pointer; margin-bottom: 36px; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .giftbox__body { position: absolute; bottom: 0; left: 8%; width: 84%; height: 68%; border-radius: 8px; background: linear-gradient(160deg, var(--rose-1), var(--rose-2)); box-shadow: 0 24px 50px -18px rgba(138, 92, 240, .7); }
  .giftbox__lid { position: absolute; top: 8%; left: 0; width: 100%; height: 28%; border-radius: 8px; background: linear-gradient(160deg, #e6cfff, var(--rose-2)); transform-origin: center bottom; transition: transform .6s cubic-bezier(.5,-0.4,.4,1.4), opacity .6s; z-index: 3; }
  .giftbox__ribbon { position: absolute; top: 0; left: 50%; width: 16%; height: 100%; transform: translateX(-50%); background: linear-gradient(var(--gold-soft), var(--gold)); }
  .giftbox__bow { position: absolute; top: -22px; left: 50%; width: 46px; height: 30px; transform: translateX(-50%); }
  .giftbox__bow::before, .giftbox__bow::after { content: ""; position: absolute; top: 0; width: 22px; height: 30px; background: linear-gradient(var(--gold-soft), var(--gold)); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%; }
  .giftbox__bow::before { left: 0; transform: rotate(-18deg) skewX(-12deg); }
  .giftbox__bow::after  { right: 0; transform: rotate(18deg) skewX(12deg); }
  .giftbox.is-open { animation: none; }
  .giftbox.is-open .giftbox__lid { transform: translateY(-60px) rotate(-22deg); opacity: 0; }
  .giftbox.is-open .giftbox__body { animation: pop .5s ease forwards; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(0); opacity: 0; } }
  .box-hint { color: var(--muted); font-size: 14px; font-weight: 300; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
  .screen.fade-out { animation: fadeOut .5s forwards; }
  .screen.fade-in  { animation: fadeIn .7s ease forwards; }
  @keyframes fadeOut { to { opacity: 0; transform: scale(.96); } }
  @keyframes fadeIn  { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; } }
  /* screen 1.5: apology letter */
  .letter-screen { z-index: 1; position: relative; }
  .letter { max-width: 40ch; }
  .letter-title { font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 600; font-size: clamp(36px, 9vw, 60px); color: var(--gold-soft); margin-bottom: 30px; opacity: 0; animation: lineIn 1s ease forwards; }
  .letter-line { font-family: "Cormorant Garamond", serif; font-size: clamp(18px, 4.6vw, 23px); line-height: 1.55; color: var(--ink); margin-bottom: 14px; opacity: 0; animation: lineIn .9s ease forwards; }
  .letter-line.final { color: var(--gold-soft); margin-top: 22px; font-size: clamp(19px, 4.8vw, 25px); }
  @keyframes lineIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .continue-btn { margin-top: 38px; background: linear-gradient(160deg, var(--violet-1), var(--violet-2)); color: #fff; border: none; border-radius: 999px; padding: 15px 30px; font-family: inherit; font-weight: 500; font-size: 15px; cursor: pointer; box-shadow: 0 16px 36px -14px rgba(138,92,240,.8); opacity: 0; transition: transform .15s; }
  .continue-btn:active { transform: scale(.96); }

  /* screen 2 */
  .gifts-screen { justify-content: flex-start; z-index: 1; position: relative; }
  .gifts-header { padding: 48px 0 28px; }
  .gifts-eyebrow { letter-spacing: .35em; text-transform: uppercase; font-size: 12px; color: var(--gold); margin-bottom: 10px; }
  .gifts-title { font-family: "Cormorant Garamond", serif; font-size: clamp(34px, 8vw, 56px); font-weight: 600; margin-bottom: 8px; }
  .gifts-sub { color: var(--muted); font-weight: 300; max-width: 34ch; margin: 0 auto; min-height: 1.4em; transition: opacity .3s; }
  .gift-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 22px; width: 100%; max-width: 760px; margin: 0 auto; }
  /* card */
  .card { position: relative; height: 260px; perspective: 1200px; cursor: pointer; border: none; background: none; padding: 0; font-family: inherit; text-align: left; animation: cardIn .6s both; transition: opacity .5s, transform .5s, filter .5s; }
  @keyframes cardIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; } }
  .card__inner { position: relative; width: 100%; height: 100%; transition: transform .7s cubic-bezier(.4,.2,.2,1); transform-style: preserve-3d; }
  .card.is-flipped .card__inner { transform: rotateY(180deg); }
  .card__face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 20px; padding: 24px; display: flex; flex-direction: column; box-shadow: 0 20px 40px -22px rgba(0,0,0,.7); }
  .card__front { align-items: center; justify-content: center; gap: 12px; background: linear-gradient(150deg, rgba(255,255,255,.10), rgba(255,255,255,.02)); border: 1px solid rgba(255,255,255,.14); }
  .card__front .q { font-size: 56px; animation: wiggle 3s ease-in-out infinite; }
  @keyframes wiggle { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .card__front .tap { color: var(--gold); letter-spacing: .25em; text-transform: uppercase; font-size: 11px; }
  .card__front .peek { color: var(--muted); font-size: 13px; font-weight: 300; }
  .card__back { transform: rotateY(180deg); justify-content: space-between; color: #2a131f; background: linear-gradient(155deg, var(--c1), var(--c2)); }
  .card__back .emoji { font-size: 36px; }
  .card__back .value { align-self: flex-start; margin-top: 6px; background: rgba(255,255,255,.35); padding: 4px 12px; border-radius: 999px; font-size: 12px; font-weight: 600; letter-spacing: .04em; }
  .card__back h3 { font-family: "Cormorant Garamond", serif; font-size: 26px; font-weight: 600; line-height: 1.1; margin-top: 8px; }
  .card__back .sub { font-size: 13px; font-weight: 500; opacity: .8; }
  .card__back .redeem-btn { margin-top: auto; align-self: flex-start; background: #2a131f; color: var(--gold-soft); border: none; border-radius: 999px; padding: 10px 20px; font-family: inherit; font-weight: 500; font-size: 13px; cursor: pointer; transition: transform .15s; }
  .card__back .redeem-btn:active { transform: scale(.95); }
  /* chosen / locked states */
  .card.is-chosen { animation: chosenPulse 2.4s ease-in-out infinite; }
  @keyframes chosenPulse { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.03); } }
  .card.is-chosen .card__face { box-shadow: 0 0 0 3px var(--gold-soft), 0 24px 50px -18px rgba(231,192,138,.6); }
  .card.is-locked { opacity: .5; filter: grayscale(.4); pointer-events: none; }
  .lock-veil { position: absolute; inset: 0; border-radius: 20px; background: rgba(20,10,14,.55); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; z-index: 4; backface-visibility: visible; }
  .lock-veil .lock { font-size: 30px; }
  .lock-veil .lock-txt { font-size: 12px; color: var(--gold-soft); font-weight: 300; max-width: 16ch; }
  /* love note */
  .love-note { margin: 50px auto 60px; max-width: 40ch; color: var(--muted); font-weight: 300; line-height: 1.7; }
  .love-note .signed { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 22px; color: var(--gold-soft); margin-top: 14px; }
  /* modal */
  .modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; }
  .modal__backdrop { position: absolute; inset: 0; background: rgba(10, 5, 8, .7); animation: fadeIn .3s; }
  .modal__card { position: relative; z-index: 1; width: 100%; max-width: 380px; background: linear-gradient(160deg, #faf6ff, #efe6ff); color: #2a1840; border-radius: 24px; padding: 36px 28px 30px; text-align: center; box-shadow: 0 30px 70px -20px rgba(0,0,0,.6); animation: popIn .4s cubic-bezier(.3,1.4,.5,1); }
  @keyframes popIn { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .modal__close { position: absolute; top: 8px; right: 12px; background: none; border: none; font-size: 34px; line-height: 1; color: #a98cc8; cursor: pointer; padding: 6px 12px; }
  .modal__emoji { font-size: 48px; margin-bottom: 8px; }
  .modal__title { font-family: "Cormorant Garamond", serif; font-size: 30px; font-weight: 600; margin-bottom: 8px; }
  .modal__desc { font-size: 14px; line-height: 1.6; color: #5e4a78; margin-bottom: 20px; }
  .modal__yay { font-family: "Cormorant Garamond", serif; font-style: italic; font-size: 21px; color: #a86ff0; margin-bottom: 0; }
  .ticket { position: relative; display: block; width: 100%; margin: 12px 0 16px; padding: 18px 16px; border-radius: 16px; background: linear-gradient(160deg, #f4ebff, #e7d6ff); border: 2px dashed #b98ee8; cursor: pointer; font-family: inherit; transition: transform .15s; overflow: hidden; }
  .ticket:active { transform: scale(.98); }
  .ticket::before, .ticket::after { content: ""; position: absolute; top: 50%; width: 20px; height: 20px; border-radius: 50%; background: #efe6ff; transform: translateY(-50%); }
  .ticket::before { left: -12px; box-shadow: inset -2px 0 0 #b98ee8; }
  .ticket::after { right: -12px; box-shadow: inset 2px 0 0 #b98ee8; }
  .ticket__label { display: block; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #8a6ab0; margin-bottom: 8px; }
  .ticket__code { font-family: "Cormorant Garamond", serif; font-size: 34px; font-weight: 600; letter-spacing: .12em; color: #7c45c8; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <div class="hearts" aria-hidden="true"></div>

  <!-- SCREEN 1: gift box -->
  <section id="boxScreen" class="screen box-screen">
    <div class="photo-frame" id="photoFrame" hidden>
      <img id="photo" alt="Us" />
    </div>
    <p class="box-eyebrow" id="boxEyebrow">For you</p>
    <h1 class="box-title" id="boxTitle">A little something for you</h1>
    <button class="giftbox" id="giftbox" aria-label="Open your surprise">
      <div class="giftbox__lid"><span class="giftbox__bow"></span></div>
      <div class="giftbox__body"><span class="giftbox__ribbon"></span></div>
    </button>
    <p class="box-hint" id="boxHint">Tap the box to open your surprise</p>
  </section>

  <!-- SCREEN 1.5: apology letter -->
  <section id="letterScreen" class="screen letter-screen" hidden>
    <div class="letter">
      <h2 class="letter-title" id="letterTitle">I'm sorry</h2>
      <div class="letter-lines" id="letterLines"></div>
      <button class="continue-btn" id="continueBtn">There's something for you 💜</button>
    </div>
  </section>

  <!-- SCREEN 2: pick a box -->
  <main id="giftsScreen" class="screen gifts-screen" hidden>
    <header class="gifts-header">
      <p class="gifts-eyebrow" id="giftsEyebrow">Pick a box</p>
      <h2 class="gifts-title" id="giftsGreeting">Hi 💜</h2>
      <p class="gifts-sub" id="giftsSub">Choose just one — you can only keep one, so choose with your heart 💜</p>
    </header>
    <div class="gift-grid" id="giftGrid"></div>
    <footer class="love-note">
      <p id="loveNote"></p>
      <p class="signed" id="signed">— Me</p>
    </footer>
  </main>

  <!-- REDEEM POPUP -->
  <div class="modal" id="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card" role="dialog" aria-modal="true">
      <button class="modal__close" data-close aria-label="Close">&times;</button>
      <div class="modal__emoji" id="modalEmoji">🎁</div>
      <p class="modal__yay">Yay, it's yours!</p>
      <h3 class="modal__title" id="modalTitle"></h3>
      <p class="modal__desc" id="modalDesc"></p>
      <button class="ticket" id="ticket" type="button">
        <span class="ticket__label" id="ticketLabel">Your secret code · tap to copy</span>
        <span class="ticket__code" id="modalCode"></span>
      </button>
      <p class="modal__redeem" id="claimLine">Text me this code 💜 and I'll make it happen</p>
    </div>
  </div>

  <script>
  /* =====================================================================
     ⬇⬇⬇  EDIT YOUR GIFTS HERE  ⬇⬇⬇
     She picks ONE of these mystery boxes. The other two lock.
     ===================================================================== */
  const CONFIG = {
    recipientName: "Georgiana",
    fromName: "Victor",
    greeting: "Hey my love 💜",        // big line on the gifts screen
    photo: "assets/us.jpeg",          // set to "" to hide the photo
    openingTitle: "A little something for you",
    openingSubtitle: "Tap the box to open your surprise",

    // the apology letter shown after the box opens (before the gifts)
    apology: {
      title: "I'm sorry",
      lines: [
        "Sorry for the days, I spoke without thinking.",
        "Sorry for the nights, I stayed silent when you needed me.",
        "Sorry for the moments my emotions were louder than my love.",
        "Sorry for overreacting when all you wanted was peace.",
        "Sorry for the words I never meant but still said.",
        "Sorry for not knowing how to explain what I feel inside.",
        "Sorry for the distance that grew from misunderstandings.",
        "And most of all, sorry for making you feel like you were anything less than important to me.",
      ],
      button: "There's something for you 💜",
    },

    // shown before she picks
    pickPrompt: "Three mystery boxes, but you can only keep one. Tap the one your heart wants 💜",
    // shown after she picks (use {gift} for the gift name)
    chosenPrompt: "Ahh you chose {gift}! Amazing pick — it's all yours 💜",

    loveNote:
      "Whatever you picked, you deserve it and so much more. " +
      "I love spoiling you. There'll be more surprises soon. I love you. 💜",

    // the little line under the code in the popup
    claimLine: "Text me this code 💜 and I'll make it happen",
  };

  const GIFTS = [
    {
      emoji: "💆‍♀️", title: "A Relaxing Massage", subtitle: "Full hour, on me",
      value: "1 Massage",
      description: "Book your next massage anywhere you like — I've got the bill. Go relax, you've earned it.",
      code: "RELAX-01", accent: "rose",
    },
    {
      emoji: "👁️", title: "Lash Appointment", subtitle: "Fresh set, my treat",
      value: "1 Lash Set",
      description: "Your next lash appointment is fully paid for. Go get those gorgeous lashes done.",
      code: "LASH-02", accent: "violet",
    },
    {
      emoji: "🍣", title: "Sushi Buffet", subtitle: "All you can eat, my shout",
      value: "Sushi for 2",
      description: "All-you-can-eat sushi buffet on me. Bring your appetite — we're getting everything on the menu.",
      code: "SUSHI-03", accent: "emerald",
    },
  ];
  /* =====================================================================
     ⬆⬆⬆  END OF THE EDITABLE PART  ⬆⬆⬆
     ===================================================================== */

  const STORE_KEY = "geo_chosen_gift";
  const ACCENTS = {
    rose: ["var(--rose-1)", "var(--rose-2)"],
    violet: ["var(--violet-1)", "var(--violet-2)"],
    amber: ["var(--amber-1)", "var(--amber-2)"],
    emerald: ["var(--emerald-1)", "var(--emerald-2)"],
  };

  // Secret reset for Victor: open the link with ?reset on the end.
  if (location.search.indexOf("reset") !== -1) {
    try { localStorage.removeItem(STORE_KEY); } catch (e) {}
  }

  function getChosen() {
    try {
      const v = localStorage.getItem(STORE_KEY);
      return v === null ? null : parseInt(v, 10);
    } catch (e) { return null; }
  }
  function setChosen(i) {
    try { localStorage.setItem(STORE_KEY, String(i)); } catch (e) {}
  }

  function init() {
    spawnHearts();
    applyConfig();
    document.getElementById("giftbox").addEventListener("click", openBox);
    document.getElementById("continueBtn").addEventListener("click", showGifts);
  }

  function spawnHearts() {
    const layer = document.querySelector(".hearts");
    const emojis = ["💜", "💕", "✨", "🤍", "💗"];
    for (let i = 0; i < 14; i++) {
      const h = document.createElement("span");
      h.textContent = emojis[i % emojis.length];
      h.style.left = Math.random() * 100 + "vw";
      h.style.fontSize = 12 + Math.random() * 22 + "px";
      h.style.animationDuration = 9 + Math.random() * 12 + "s";
      h.style.animationDelay = Math.random() * 12 + "s";
      layer.appendChild(h);
    }
  }

  function applyConfig() {
    if (CONFIG.photo) {
      document.getElementById("photo").src = CONFIG.photo;
      document.getElementById("photoFrame").hidden = false;
    }
    document.getElementById("boxEyebrow").textContent = "For " + CONFIG.recipientName;
    document.getElementById("boxTitle").textContent = CONFIG.openingTitle;
    document.getElementById("boxHint").textContent = CONFIG.openingSubtitle;
    document.getElementById("letterTitle").textContent = CONFIG.apology.title;
    document.getElementById("continueBtn").textContent = CONFIG.apology.button;
    document.getElementById("giftsGreeting").textContent = CONFIG.greeting;
    document.getElementById("giftsSub").textContent = CONFIG.pickPrompt;
    document.getElementById("loveNote").textContent = CONFIG.loveNote;
    document.getElementById("signed").textContent = "— " + CONFIG.fromName;
  }

  function openBox() {
    const giftbox = document.getElementById("giftbox");
    if (giftbox.classList.contains("is-open")) return;
    giftbox.classList.add("is-open");
    burst();
    const boxScreen = document.getElementById("boxScreen");
    const letterScreen = document.getElementById("letterScreen");
    setTimeout(() => {
      boxScreen.classList.add("fade-out");
      setTimeout(() => {
        boxScreen.hidden = true;
        letterScreen.hidden = false;
        letterScreen.classList.add("fade-in");
        buildLetter();
      }, 480);
    }, 650);
  }

  function buildLetter() {
    const wrap = document.getElementById("letterLines");
    wrap.innerHTML = "";
    const lines = CONFIG.apology.lines;
    // each line fades in after the title, then the button appears last
    lines.forEach((text, i) => {
      const p = document.createElement("p");
      p.className = "letter-line" + (i === lines.length - 1 ? " final" : "");
      p.textContent = text;
      p.style.animationDelay = 0.6 + i * 1.1 + "s";
      wrap.appendChild(p);
    });
    const btn = document.getElementById("continueBtn");
    btn.style.animation = "lineIn 1s ease forwards";
    btn.style.animationDelay = 0.9 + lines.length * 1.1 + "s";
  }

  function showGifts() {
    const letterScreen = document.getElementById("letterScreen");
    const giftsScreen = document.getElementById("giftsScreen");
    letterScreen.classList.remove("fade-in");
    letterScreen.classList.add("fade-out");
    setTimeout(() => {
      letterScreen.hidden = true;
      giftsScreen.hidden = false;
      giftsScreen.classList.add("fade-in");
      buildCards();
    }, 480);
  }

  function burst() {
    const layer = document.querySelector(".hearts");
    const emojis = ["💜", "💕", "✨", "🎉", "💗"];
    for (let i = 0; i < 22; i++) {
      const h = document.createElement("span");
      h.textContent = emojis[i % emojis.length];
      h.style.left = 30 + Math.random() * 40 + "vw";
      h.style.bottom = "45vh";
      h.style.fontSize = 16 + Math.random() * 22 + "px";
      h.style.animationDuration = 4 + Math.random() * 4 + "s";
      h.style.animationDelay = "0s";
      layer.appendChild(h);
      setTimeout(() => h.remove(), 8000);
    }
  }

  function buildCards() {
    const grid = document.getElementById("giftGrid");
    grid.innerHTML = "";
    const already = getChosen();

    GIFTS.forEach((gift, i) => {
      const [c1, c2] = ACCENTS[gift.accent] || ACCENTS.rose;
      const card = document.createElement("button");
      card.className = "card";
      card.style.setProperty("--c1", c1);
      card.style.setProperty("--c2", c2);
      card.style.animationDelay = i * 0.1 + "s";

      card.innerHTML =
        '<div class="card__inner">' +
          '<div class="card__face card__front">' +
            '<span class="q">🎁</span>' +
            '<span class="tap">Box ' + (i + 1) + '</span>' +
            '<span class="peek">Tap to choose</span>' +
          '</div>' +
          '<div class="card__face card__back">' +
            '<span class="emoji">' + gift.emoji + '</span>' +
            '<span class="value">' + gift.value + '</span>' +
            '<h3>' + gift.title + '</h3>' +
            '<span class="sub">' + gift.subtitle + '</span>' +
            '<span class="redeem-btn">Redeem 💜</span>' +
          '</div>' +
        '</div>';

      card.addEventListener("click", () => onCardClick(i));
      grid.appendChild(card);
    });

    // If she already picked earlier, restore that state (no confetti).
    if (already !== null && GIFTS[already]) {
      revealChoice(already, false);
    }
  }

  function onCardClick(i) {
    const chosen = getChosen();
    if (chosen === null) {
      // first ever pick — lock it in
      setChosen(i);
      revealChoice(i, true);
      return;
    }
    // already chosen: only the chosen card is interactive -> open its code
    if (i === chosen) openModal(GIFTS[i]);
  }

  function revealChoice(chosenIndex, celebrate) {
    const cards = document.querySelectorAll(".gift-grid .card");
    cards.forEach((card, i) => {
      if (i === chosenIndex) {
        card.classList.add("is-flipped", "is-chosen");
      } else {
        card.classList.add("is-locked");
        if (!card.querySelector(".lock-veil")) {
          const veil = document.createElement("div");
          veil.className = "lock-veil";
          veil.innerHTML = '<span class="lock">🔒</span><span class="lock-txt">Saved for another day 💫</span>';
          card.appendChild(veil);
        }
      }
    });

    // update the header text
    document.getElementById("giftsEyebrow").textContent = "Your gift";
    document.getElementById("giftsSub").textContent =
      CONFIG.chosenPrompt.replace("{gift}", GIFTS[chosenIndex].title);

    if (celebrate) {
      burst();
      // pop the code up automatically a moment after the flip
      setTimeout(() => openModal(GIFTS[chosenIndex]), 1100);
    }
  }

  function openModal(gift) {
    document.getElementById("modalEmoji").textContent = gift.emoji;
    document.getElementById("modalTitle").textContent = gift.title;
    document.getElementById("modalDesc").textContent = gift.description;
    document.getElementById("modalCode").textContent = gift.code;
    document.getElementById("claimLine").textContent = CONFIG.claimLine;

    // tap the ticket to copy the code
    const ticket = document.getElementById("ticket");
    const label = document.getElementById("ticketLabel");
    ticket.onclick = () => {
      const done = () => {
        label.textContent = "Copied! 💜";
        setTimeout(() => { label.textContent = "Your secret code · tap to copy"; }, 1600);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(gift.code).then(done).catch(done);
      } else {
        done();
      }
    };

    const modal = document.getElementById("modal");
    modal.hidden = false;
    modal.querySelectorAll("[data-close]").forEach((el) => {
      el.onclick = () => (modal.hidden = true);
    });
    document.onkeydown = (e) => { if (e.key === "Escape") modal.hidden = true; };
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
  </script>
</body>
</html>
